# port/nhl13_team_hooks.toml; разбор мест — legacy-port/analysis/team32/hooks_map.md (локально) и
# docs/legacy-port.md). Места «30 → 32» одной инструкцией — nhllegacy_team_sites.toml (генератор
# tools/team_hooks.py --game legacy по nhllegacy_team32_sites.json / nhllegacy_ahl32_sites.json).

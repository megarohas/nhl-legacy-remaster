# 54, сборные 55/56; сборные при 32 — teamid 222/223; ahl32 — фарм-клубы SEA/VGK teamid 224/225 (номера
# 62/63); драфт — две таблицы порядка 0x83A15178 и 0x83A151F0; лотерея — r1+384; таблица статистики —
# записи +36, число +48, список узла — число +88.


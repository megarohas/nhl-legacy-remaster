# Цвета кресел арен NHL Legacy на сезон 2026/27 — рецепты для `python stadium.py recipe` (docs/arenas.md).
#
# Ключ [arena.N] — номер модели арены (`exhibitionarena.arenaartid`, файл rendering/crowddata/crowd_N.cwd).
# rules — правила stadium.py: "[фильтр,…:]#RRGGBB" (без фильтра — все кресла; color=, y=, tier=, x=, z=).
# Цвет правила — оттенок кресла Legacy (множитель серой текстуры chair_cm), не цвет на экране.
# status:
#   proposed — предложение агента (23.10.2026), пользователь ещё не смотрел; `recipe --approved` его пропускает;
#   approved — одобрено пользователем (дата и слова — в note);
#   keep     — у EA уже близко к нынешней арене, не трогать.
# confidence: high — реальная замена кресел подтверждена новостью и совпадает с NHL 27; medium — NHL 27 во всех
# (или 3 из 4) вариантах кресел даёт один цвет, а у Legacy другой; low — данных мало.
# nhl27 — основной цвет текстур кресел NHL 27 crowd_chair_<город>_0…3 (`stadium.py nhl27`), в скобках — оттенок
# Legacy ×1.43 (калибровка по TB и BUF, NHL27_GAIN в stadium.py). Какой вариант NHL 27 стоит в каком секторе —
# неизвестно (раскладка кресел NHL 27 не разбиралась), поэтому где у NHL 27 несколько цветов — берётся основной.


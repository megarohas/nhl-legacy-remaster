# Клюшки NHL Legacy: что лежит в слотах каталога (texlib_<N>.rx2, playerstick_<N>_cm) — перенос из NHL 27 и имена.
# Сборка и пакет — python -m fb.sticks (docs/sticks.md); edge_kit pack кладёт их в pack-edge вместе с формами.
#
# Слоты — 27 клюшек каталога редактора (записи по 0x7C байт в default.bin, разбор 23.10.2026,
# game/work/equipment27/proposal.md); буква — порядок в редакторе. N — номер текстуры и значение
# exhibitionskaterequipment.stick у игрока: у игроков меняется только картинка и имя, база не трогается.
#
# from: "nhl27:<модель>" — текстура player_stick_<модель>_color NHL 27 через общую модель клюшки (fb.sticks.convert);
#       "legacy:<N>" — текстура слота N из архива Legacy как есть (оригинал, не наша замена).
# key, name: строка локализации с именем клюшки (nhl_eng_us.db) и новый текст. Ключи bauersupreme1s, bauervapor1x,
# bauerpreorder, ccmpreorder, eastonpreorder общие с коньками каталога — имя меняется и у конька.
#
# Решение пользователя 23.10.2026: «портировать клюшки из NHL 27 сколько можно» по предложению proposal.md, в слот D
# (BUSCH HPC 2.0, 0 игроков) — белую CCM из Legacy (слот 72, заблокирован предзаказом): «чтобы её можно было выбрать в
# редакторе без разблокировки». Слоты X, Y, Z, AA (предзаказ) в редакторе закрыты — переносим тоже, для игроков из базы.


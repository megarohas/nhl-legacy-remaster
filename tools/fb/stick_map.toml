# Клюшки NHL Legacy (cacherender/rendering/playerstick/texlib_<N>.rx2, растр playerstick_<N>_cm 1024×128 DXT1)
# ↔ клюшки NHL 24 (content/character/skater/player/stick/<марка>/<линейка>/textures/player_stick_*_color, 2048×512).
# Перенос — через 3D: сетки player_stick_left_shaft + left_blade (NHL 24) → playerstick_0_2 (Legacy, та же система
# координат; у Legacy рукоять под отдельной сеткой ленты). Правая клюшка Legacy (playerstick_1_*) берёт ту же текстуру.
#
# [same] — у 34 клюшек Legacy та же модель и тот же рисунок, что в NHL 24 (EA перенесла их сама в Legacy Edition):
# сверено листом compare/_stick_pairs.png. Перенос даёт ту же картинку чуть мягче (резкость −10…25 %), поэтому в пакет
# они не идут — таблица для справки.
# [replace] — замена старой модели Legacy новой из NHL 24 (смена каталога: у игроков в базе — номер клюшки). Пусто, пока
# пользователь не решит, какую на какую: python -m fb.pilot sticks — кладёт в пакет только [replace].

# 23.10.2026: слоты каталога заняты клюшками NHL 27 — план fb/stick_slots.toml (fb.sticks, docs/sticks.md); в pack-edge
# он главнее [replace] отсюда.


# Коньки NHL Legacy: что лежит в слотах каталога (cacherender/rendering/skate/texlib_<N>.rx2, skate_<N>_cm) — перенос
# из NHL 27 и имена. Сборка и пакет — python -m fb.skates (docs/skates.md); edge_kit pack кладёт их в pack-edge.
#
# Слоты — 11 коньков каталога редактора (записи по 0x1C байт в default.bin с 0x19b9f3c, разбор 23.10.2026); буква —
# порядок в редакторе. N — номер текстуры и значение exhibitionskaterequipment.skatebrand у игрока: у игроков меняются
# только картинка и имя. Игроки базы носят только 39, 41, 43–48; прочие texlib_ в архиве — вратарские и старые.
#
# from: "nhl27:<модель>" — текстура player_skate_<модель>_color NHL 27 (модель конька — своя, если есть, иначе общая
#       модель бренда: fb.skates.mesh_of) переносом по 3D на модель конька Legacy.
# key, name: строка локализации и новый текст. Ключи bauersupreme1s, bauervapor1x, bauerpreorder, ccmpreorder,
# eastonpreorder общие с клюшками (fb/stick_slots.toml) — имя у них задаёт план клюшек (здесь name = null).
#
# Решение пользователя 23.10.2026: «адаптировать все коньки — модель, текстуру, название из NHL 27» (заранее «да» на
# замены). Слоты — по предложению game/work/equipment27/proposal.md; A (BAUER Nexus 8000, ключ свой) — CCM Jetspeed FT6,
# а Bauer Supreme Shadow — в слот I (BAUER Preorder): имя у I общее с клюшкой X («BAUER Twitch») — пусть хоть бренд тот же.


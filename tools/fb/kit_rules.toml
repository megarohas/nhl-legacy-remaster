# Правила нашивок при переносе формы NHL 24 → NHL Legacy (python -m fb.kit_hybrid).
#
# Основа свитера (цвет, полосы, фактура) переносится через 3D из jersey_*_base_color — без нашивок. Нашивки —
# участки, где готовый jersey_*_color отличается от основы; каждая ставится отдельной «декалью»: центр и
# ориентация — с поверхности свитера NHL 24, точка садится на ближайшую точку свитера Legacy, рисунок
# проецируется на поверхность Legacy (по текселям — без разрывов на швах развёртки).
#
# Нашивка опознаётся по центру на развёртке NHL 24 (uv, доли 0..1; у всех клубов на этой сетке места одинаковы).
#   offset_cm  = [x, y, z] — сдвиг в мировых осях: +x — к левой руке игрока (вправо на виде спереди), +y — вверх,
#                +z — вперёд (грудь); после сдвига точка снова садится на свитер Legacy
#   scale      — множитель размера; rotate_deg — доворот в плоскости нашивки; enabled = false — не ставить
# Переопределения по клубу и форме: [club.<КОД>.<форма>.<нашивка>] с теми же ключами.

[defaults]
min_area = 200        # пикселей на 2048² — мельче не нашивка
threshold = 30        # разница цвета (сумма RGB) «нашивка/основа»
match_radius = 0.05   # насколько центр может отстоять от uv правила

[patch.crest]
uv = [0.501, 0.740]
note = "герб на груди"

[patch.chest_patch]
uv = [0.430, 0.620]
note = "спонсорская нашивка на груди (с 2022–23)"

[patch.shoulder_r]
uv = [0.400, 0.500]
note = "плечевая нашивка, правое плечо игрока (слева на виде спереди)"

[patch.shoulder_l]
uv = [0.600, 0.500]
note = "плечевая нашивка, левое плечо игрока"

[patch.neck_shield]
uv = [0.500, 0.577]
offset_cm = [0.0, -4.0, 0.0]
note = "щит NHL у горловины: у Legacy там вставка воротника — ниже на 4 см по поверхности"

[patch.back_neck]
uv = [0.500, 0.434]
note = "логотип производителя сзади у ворота (adidas)"

[patch.hem_tag]
uv = [0.392, 0.014]
note = "бирка на нижнем крае"

# пример переопределения для клуба и формы
[club.SEA.home.neck_shield]
offset_cm = [0.0, -4.0, 0.0]

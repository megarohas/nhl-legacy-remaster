# Правила нашивок при переносе формы NHL 24 → NHL Legacy (python -m fb.kit_hybrid).
#
# Основа свитера (цвет, полосы, фактура) переносится через 3D из jersey_*_base_color — без нашивок. Нашивки —
# участки, где готовый jersey_*_color отличается от основы; каждая ставится отдельной «декалью»: центр и
# ориентация — с поверхности свитера NHL 24, точка садится на ближайшую точку свитера Legacy, рисунок
# проецируется на поверхность Legacy (по текселям — без разрывов на швах развёртки).
#
# Нашивка опознаётся по центру на развёртке NHL 24 (uv, доли 0..1; у всех клубов на этой сетке места одинаковы).
#   offset_cm  = [x, y, z] — сдвиг в мировых осях: +x — к левой руке игрока (вправо на виде спереди), +y — вверх,
#                +z — вперёд (грудь); после сдвига точка снова садится на свитер Legacy
#   scale      — множитель размера; rotate_deg — доворот в плоскости нашивки; enabled = false — не ставить
# Переопределения: профиль [profile.<имя>.<нашивка>] (--profile имя, например laces) и клуб/форма
# [club.<КОД>.<форма>.<нашивка>] с теми же ключами; порядок: patch ← profile ← club.

[defaults]
min_area = 200        # пикселей на 2048² — мельче не нашивка
threshold = 30        # разница цвета (сумма RGB) «нашивка/основа»
match_radius = 0.05   # насколько центр может отстоять от uv правила

[patch.crest]
uv = [0.501, 0.740]
win = 0.12            # у комплектов без base герб ищется в окне ±win (для [crest_fit]), под ним — отражение соседей
fill = "mirror"
smooth = 3            # окно сглаживается (фактура ткани — не герб)
note = "герб на груди"

[patch.chest_patch]
uv = [0.430, 0.620]
win = 0.035
note = "спонсорская нашивка на груди, правая сторона игрока (с 2022–23)"

[patch.shoulder_r]
uv = [0.400, 0.500]
note = "плечевая нашивка, правое плечо игрока (слева на виде спереди)"

[patch.shoulder_l]
uv = [0.600, 0.500]
note = "плечевая нашивка, левое плечо игрока"

[patch.neck_shield]
uv = [0.500, 0.577]
offset_cm = [0.0, -4.0, 0.0]
# решение пользователя 12.10: щиток стоял на 4 мм левее середины и на 2 см ниже, чем у EA. У всех EA-форм Legacy
# (53 формы, со шнуровкой и без) щит — в одной и той же точке развёртки: центр (0,5; 0,595), у мыска V; наш — туда же
# (legacy_uv важнее offset_cm)
legacy_uv = [0.5, 0.595]
scale = 0.8           # щит NHL 24 на Legacy на ~25 % крупнее щита EA (≈16×20 текселей из 1024²)
note = "щит NHL у горловины — на месте щита EA-форм Legacy"

[patch.back_neck]
uv = [0.500, 0.434]
note = "логотип производителя сзади у ворота (adidas)"

[patch.hem_tag]
uv = [0.392, 0.014]
note = "бирка на нижнем крае"

# пример переопределения для клуба и формы
[club.SEA.home.neck_shield]
offset_cm = [0.0, -4.0, 0.0]

# профиль «шнуровка ворота» (комплект Legacy с hastie 1, сетка jerseytie поверх ворота): щит NHL ниже шнурков
[profile.laces.neck_shield]
offset_cm = [0.0, -9.0, 0.0]

# проба: SEA дом на сетке со шнуровкой (то же, что --profile laces)
[club.SEA.home_laces.neck_shield]
offset_cm = [0.0, -9.0, 0.0]

# V-вставка ворота Legacy (крой Edge) — в цвет свитера: у adidas ворот круглый, выреза нет. В вырезе ворота Legacy видна
# сетка «рубашки» rendering/jersey/shirt_1_1_2 (её развёртка — угол текстуры свитера u 0,08…0,18, v 0,85…0,90);
# при mode = "body" она заливается основным цветом свитера под воротом — медиана окна sample_box вокруг sample_uv на
# развёртке NHL 24 (основа, без нашивок). mode = "keep" — оставить как перенеслось.
[collar.v_insert]
mode = "body"
# цвет — самый частый в окне ±0,03 под воротом: у кроя со шнуровкой (MIN, NYI, NYR, BUF) медиана маленького окна
# попадала на шнурки и давала бурый/лиловый
sample_uv = [0.5, 0.625]
sample_box = 0.03
method = "mode"

[patch.chest_patch_r]
uv = [0.570, 0.620]
win = 0.035
note = "спонсорская нашивка на груди, левая сторона игрока (у части клубов)"

# Решения пользователя (09.10):
# спонсорские нашивки на свитерах (круглые/прямоугольные патчи на груди с 2022–23: у SEA — Muckleshoot, у TOR — Milk,
# у MTL — RBC, у PIT — Highmark, у STL — Stifel, у WPG — Canada Life, у CBJ — Safelite, …) не ставятся. Опознание —
# по месту на развёртке NHL 24 (верх груди, слева/справа от герба), а не по номеру слоя: номера branding_jersey_*_N
# у клубов разные. Где нашивка — слой base, её просто не накладываем; где зашита в готовый свитер (нет base) —
# закрашивается построчной интерполяцией цвета соседей (горизонтальные полосы не размываются).
[sponsor]
drop = true
patches = ["chest_patch", "chest_patch_r"]

# Рельеф свитера Legacy — чистые карты кроя T=4 у всех форм (переопределений нет).
[relief]
t = 4

# (CHI three — с 10.10 обычная альтернативная из папки two; правило щита для Winter Classic 2019 снято)

# MIN дом/выезд: спонсор Tria зашит прямо в base-слой NHL 24 (нашивка с фоном и надписью) — снимается весь прямоугольник
[club.MIN.home.chest_patch]
box = [0.401, 0.598, 0.460, 0.661]

[club.MIN.away.chest_patch]
box = [0.401, 0.598, 0.460, 0.661]

# Решение пользователя (10.10, 09:00): в слот «третья» — обычная альтернативная форма клуба, а не форма разового
# матча (Winter Classic, Stadium Series) и не копия домашней. Папка комплекта NHL 24 (adidas/<папка>) для третьей;
# у остальных клубов — adidas/three.
[third_source]
VGK = "two"    # золотая (three — копия домашней)
CHI = "two"    # чёрная (three — Winter Classic 2019)
CAR = "two"    # чёрная «флаг» (three — Stadium Series 2023)
TBL = "two"    # чёрная (three — Stadium Series 2022)
NYR = "two"    # тёмно-синяя винтажная (three — Stadium Series 2024)
STL = "two"    # голубая (three — Winter Classic 2022)
BUF = "seven"  # чёрная Goathead (three — белая, почти как выездная)
PHI = "two"    # чёрная, спонсор IBX снимается (three — оранжевая, почти как домашняя)
CBJ = "two"    # «пушка» (своей three в NHL 24 нет)
WSH = "twentythree"  # чёрная с орлом Screaming Eagle (решение 09:05; three — Stadium Series 2023)
TOR = "seven"  # чёрная (решение 09:05; three — Heritage Classic 2022)
# PIT — своя adidas/three (чёрная с жёлтыми рукавами), по решению 09:05 оставлена

# PHI третья (NHL 24 adidas/two): спонсор «Independence IBX» шире окна поиска — снимается весь прямоугольник
[club.PHI.three.chest_patch]
box = [0.403, 0.594, 0.470, 0.637]

# Полоски на рукавах — ближе к кисти (решение пользователя 11.10): номер на плече (игра рисует его по карте номеров
# шаблона, зоны 2 и 3) ложился на полосы у локтя. Развёртка Legacy: рукава вдоль u, манжета у края u (строки rows).
# На каждом рукаве рисунок от манжеты до верха полос сжимается к манжете в base_k раз (у всех: «не сильно, но ближе»),
# а если до зоны номера всё равно меньше gap_min — сильнее, но не меньше min_k; манжета на месте, однотонный рукав
# до дальнего края зоны номера растягивается, плечо и пройма дальше — без изменений. Образец — EA CHI 1_6_0
# (зазор полосы—номер 0,066). Применяется к формам NHL 24 и к нашей Юте (tools/utah).
[sleeve]
rows = [0.28, 0.73]
gap_min = 0.05
base_k = 0.85
min_k = 0.7

# Герб на груди не заходит на букву капитана/ассистента (решение пользователя 12.10; у VGK и SEA буквы ложились на
# герб). Зона буквы — зона 5 карты номеров шаблона формы. У EA-форм Legacy зазор «герб — зона буквы» по 76 формам:
# медиана 0,02, четверть — меньше 0,01; низ герба — медиана v 0,826, у 90 % — не ниже 0,85 (python -m fb.kit_fix survey).
# Если зазор меньше gap_min: герб сначала опускается (низ — не ниже max_bottom), потом уменьшается относительно
# середины нижнего края (anchor = "bottom": верх и бока уходят от буквы), не меньше min_scale. Действует на все формы
# при сборке (fb.pilot build); у комплектов без base герб для этого ставится декалью.
[crest_fit]
zones = [5]
gap_min = 0.02
max_bottom = 0.85
min_scale = 0.6
anchor = "bottom"

# Ворот со шнуровкой без 3D-шнурков (решение пользователя 12.10, пилот — MIN дом; потом, возможно, на многие клубы):
# ворот EA-комплекта Legacy со шнуровкой (from) переносится слоями по маскам EA (fb.kit_fix.CollarLace): ткань
# свитера → ворот и нарисованный V (перекраска со светотенью EA: выше split_v — collar, ниже — v_insert; красное ниже
# низа щита v_bottom — прорезь под шнурками — не берётся) → шнурки (по форме, цвет lace, без тёмной обводки) →
# люверсы (как у EA) → щит NHL по контуру (свой щит при этом не ставится). Рельеф — весь от from, нашивки EA в нём
# (smooth_boxes) — чистая основа A. У новых строк hastie 0. Цвета: <часть>_color = [r, g, b] или <часть>_uv = [u, v]
# на основе NHL 24. Общие ключи — раскладка EA-ворота со шнуровкой на развёртке Legacy (u0, v0, u1, v1), у EA одна.
[collar_lace]
shield_box = [0.488, 0.583, 0.512, 0.607]
lace_box = [0.455, 0.590, 0.545, 0.670]
split_v = 0.524        # выше — ворот (внутренняя сторона, видна в вырезе), ниже — нарисованный V на груди
lace_top = 0.592       # шнурки — ниже края кокетки EA (выше зелёное — кокетка, не шнурок)
shield_down = 0.0      # сдвиг щита EA вниз (доля v); 0 — на месте щита EA, как у всех EA-форм

# MIN дом (выбор пользователя 12.10, «v4»): ворот третьей EA-формы MIN 1_14_2 как есть (кремовый ворот, тёмно-красный
# V, кремовые шнурки) — без перекраски; раскладка и рельеф — выездной 1_14_3 (в рельефе заглажены Reebok сзади,
# круглые плечевые и герб). Прежний вариант v3 — from = "1_14_3" с перекраской в цвета NHL 24.
[collar_lace.MIN.home]
from = "1_14_2"
recolor = false
layout_from = "1_14_3"
relief_from = "1_14_3"
collar_uv = [0.5, 0.50]
v_insert_uv = [0.5, 0.565]
lace_uv = [0.5, 0.50]
smooth_boxes = [[0.44, 0.380, 0.56, 0.420], [0.34, 0.44, 0.43, 0.52], [0.57, 0.44, 0.66, 0.52], [0.36, 0.65, 0.64, 0.86]]

# MIN дом (решение пользователя 12.10): кремовая полоса на груди чуть уже — заходила на подмышку при движении рук.
# Верхний край — прямая на trim ниже прежнего (по середине груди, столбцы ref_u), выше — цвет свитера (body_uv);
# band_uv — точка полосы на развёртке Legacy.
[chest_band.MIN.home]
trim = 0.012
band_uv = [0.34, 0.73]
body_uv = [0.34, 0.655]

# Правила нашивок при переносе формы NHL 24 → NHL Legacy (python -m fb.kit_hybrid).
#
# Основа свитера (цвет, полосы, фактура) переносится через 3D из jersey_*_base_color — без нашивок. Нашивки —
# участки, где готовый jersey_*_color отличается от основы; каждая ставится отдельной «декалью»: центр и
# ориентация — с поверхности свитера NHL 24, точка садится на ближайшую точку свитера Legacy, рисунок
# проецируется на поверхность Legacy (по текселям — без разрывов на швах развёртки).
#
# Нашивка опознаётся по центру на развёртке NHL 24 (uv, доли 0..1; у всех клубов на этой сетке места одинаковы).
#   offset_cm  = [x, y, z] — сдвиг в мировых осях: +x — к левой руке игрока (вправо на виде спереди), +y — вверх,
#                +z — вперёд (грудь); после сдвига точка снова садится на свитер Legacy
#   scale      — множитель размера; rotate_deg — доворот в плоскости нашивки; enabled = false — не ставить
# Переопределения: профиль [profile.<имя>.<нашивка>] (--profile имя, например laces) и клуб/форма
# [club.<КОД>.<форма>.<нашивка>] с теми же ключами; порядок: patch ← profile ← club.

[defaults]
min_area = 200        # пикселей на 2048² — мельче не нашивка
threshold = 30        # разница цвета (сумма RGB) «нашивка/основа»
match_radius = 0.05   # насколько центр может отстоять от uv правила

[patch.crest]
uv = [0.501, 0.740]
note = "герб на груди"

[patch.chest_patch]
uv = [0.430, 0.620]
win = 0.035
note = "спонсорская нашивка на груди, правая сторона игрока (с 2022–23)"

[patch.shoulder_r]
uv = [0.400, 0.500]
note = "плечевая нашивка, правое плечо игрока (слева на виде спереди)"

[patch.shoulder_l]
uv = [0.600, 0.500]
note = "плечевая нашивка, левое плечо игрока"

[patch.neck_shield]
uv = [0.500, 0.577]
offset_cm = [0.0, -4.0, 0.0]
note = "щит NHL у горловины: у Legacy там вставка воротника — ниже на 4 см по поверхности"

[patch.back_neck]
uv = [0.500, 0.434]
note = "логотип производителя сзади у ворота (adidas)"

[patch.hem_tag]
uv = [0.392, 0.014]
note = "бирка на нижнем крае"

# пример переопределения для клуба и формы
[club.SEA.home.neck_shield]
offset_cm = [0.0, -4.0, 0.0]

# профиль «шнуровка ворота» (комплект Legacy с hastie 1, сетка jerseytie поверх ворота): щит NHL ниже шнурков
[profile.laces.neck_shield]
offset_cm = [0.0, -9.0, 0.0]

# проба: SEA дом на сетке со шнуровкой (то же, что --profile laces)
[club.SEA.home_laces.neck_shield]
offset_cm = [0.0, -9.0, 0.0]

# V-вставка ворота Legacy (крой Edge) — в цвет свитера: у adidas ворот круглый, выреза нет. В вырезе ворота Legacy видна
# сетка «рубашки» rendering/jersey/shirt_1_1_2 (её развёртка — угол текстуры свитера u 0,08…0,18, v 0,85…0,90);
# при mode = "body" она заливается основным цветом свитера под воротом — медиана окна sample_box вокруг sample_uv на
# развёртке NHL 24 (основа, без нашивок). mode = "keep" — оставить как перенеслось.
[collar.v_insert]
mode = "body"
# цвет — самый частый в окне ±0,03 под воротом: у кроя со шнуровкой (MIN, NYI, NYR, BUF) медиана маленького окна
# попадала на шнурки и давала бурый/лиловый
sample_uv = [0.5, 0.625]
sample_box = 0.03
method = "mode"

[patch.chest_patch_r]
uv = [0.570, 0.620]
win = 0.035
note = "спонсорская нашивка на груди, левая сторона игрока (у части клубов)"

# Решения пользователя (09.10):
# спонсорские нашивки на свитерах (круглые/прямоугольные патчи на груди с 2022–23: у SEA — Muckleshoot, у TOR — Milk,
# у MTL — RBC, у PIT — Highmark, у STL — Stifel, у WPG — Canada Life, у CBJ — Safelite, …) не ставятся. Опознание —
# по месту на развёртке NHL 24 (верх груди, слева/справа от герба), а не по номеру слоя: номера branding_jersey_*_N
# у клубов разные. Где нашивка — слой base, её просто не накладываем; где зашита в готовый свитер (нет base) —
# закрашивается построчной интерполяцией цвета соседей (горизонтальные полосы не размываются).
[sponsor]
drop = true
patches = ["chest_patch", "chest_patch_r"]

# Рельеф свитера Legacy — чистые карты кроя T=4 у всех форм (переопределений нет).
[relief]
t = 4

# CHI третья (Winter Classic, полосы вокруг ворота): щит NHL на развёртке NHL 24 ниже обычного (0,599 вместо 0,577),
# в стандартное окно не попадал — щит оставался на старом месте, без −4 см
[club.CHI.three.neck_shield]
uv = [0.5007, 0.5986]

# MIN дом/выезд: спонсор Tria зашит прямо в base-слой NHL 24 (нашивка с фоном и надписью) — снимается весь прямоугольник
[club.MIN.home.chest_patch]
box = [0.401, 0.598, 0.460, 0.661]

[club.MIN.away.chest_patch]
box = [0.401, 0.598, 0.460, 0.661]

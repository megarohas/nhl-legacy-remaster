# Профили клубов подхода C (fb.edge_kit, docs/kitport.md §5.3): что у формы клуба своего. Ключ — код клуба
# (fb.kit_batch.CLUBS). Выбор — `--club` у kit / slot; pack берёт все клубы, у которых собран слот.
#
# source            — откуда текстуры (fb.kitsrc): nhl24 | nhl27. Сетки-источники переноса — всегда NHL 24.
# source_kits       — форма → папка комплекта источника adidas/<папка> (fb.kitsrc.folder): у NHL 27 папки home/away —
#                     прежние формы времён NHL 24, нынешние — ten/eleven… по базе NHL 27 (kitport survey печатает их).
#                     Через неё — свитер, основа, рельеф, шрифт, шорты, гетры, наклейка. Нет — папка = форма
# yoke_color        — как узнавать кокетку по цвету (на текстуре источника, нашей и у EA-формы):
#                     green — тёмно-зелёная (lum < порога, G > R + 15; MIN), dark — чёрная (lum < порога, max − min < 45)
# yoke              — формы с цветной кокеткой: форма → EA-форма Legacy того же клуба, с которой берутся бока кокетки на
#                     развёртке Edge и высота её края сзади (у NHL 24/27 спина выше: «зелёное кончается высоко», MIN 19.10)
# collar            — ворот: lace — adidas со шнуровкой, красной вставкой и планкой (MIN: их швы, зоны, превью; по умолчанию),
#                     plain — без них (NJD: кромка по кокетке, спереди мыс кокетки со щитом — высота края от середины)
# collar_trim       — кромка ворота: auto (по замеру источника, по умолчанию), smooth — плавная по углу (MIN, NJD),
#                     step — «ступенькой»: спереди узкая (с разрывом посередине, если он у источника), сбоку ступенька,
#                     сзади — во всю ширину до шва обода (TBL; edge_kit.trim_profile / step_width)
# trim_step_from    — град: узкая часть кромки и ступенька — замер с этого |θ| (22.10, NYI дом: вставка шнуровки цвета
#                     кромки у середины давала ступеньку на 15° — кромка до обода по всему переду); нет — с середины
# trim_width_from   — форма → форма клуба, по чьей кромке мерить ширину кромки ворота (21.10, BOS дом: чёрная кромка
#                     на чёрной ткани — замер по цвету давал 3,7 см, щит по зазору уезжал на 2 см вниз). Генератор
#                     ставит сам, если у формы кромка цвета ткани, а у другой — видна. Нет — замер по своей форме
# body_color        — цвет ткани: light — медиана светлого (lum > 200, MIN), back — середина спины (NJD: дом красный)
# yoke_shape_color  — цвет кокетки у EA-форм yoke (бока): green | dark; по умолчанию — как yoke_color. Бока задают вид
#                     кокетки: «до плеча» (кончается на плечевом суставе — MIN 1_14_3, новые NJD) или «на плечо»
#                     (заходит на сустав и руку — EA-формы NJD 1_17_x, выезд MTL)
# yoke_side_blend   — для кокетки «на плечо»: полуширина (м по z) перехода края от переда к спине — на руке край одной
#                     прямой наискосок (у NHL 24/27 спина ниже переда на 1,5–2,5 см, без перехода — «лесенка»; MTL, ANA?);
#                     нет — скачок на боку. С 22.10 (MTL, BUF, DAL) у такой кокетки и боков EA нет: шапка на руке кончается
#                     этим краем (бока EA обрезали её у острова рукава); EA-форма yoke — своя форма клуба, даёт край сзади
# yoke_color, yoke_shape_color — ещё и [R, G, B] (22.10): кокетка — цвет ближе edge_kit.YOKE_RGB_DIST (60) к этому
#                     (красная MTL, синяя BUF, зелёная DAL NHL 27: green / dark узнают не все)
# yoke_stripe       — "source": полоса другого цвета под нижним краем кокетки (22.10, BUF выезд: золотая ~0,9 см спереди,
#                     сзади и на руке) — цвет и ширина по источнику; у мыса со щитом её нет (кончается у V)
# yoke_back         — "source": край кокетки сзади — как у источника (у NHL 27 MTL 1,65 м, BUF 1,66 — выше переда); нет —
#                     по EA-форме yoke (как MIN и NJD: «зелёное кончается высоко», 19.10)
# yoke_back_from    — { форма = ["EA-форма", цвет] } (23.10, агент fix-b, NSH выезд): край кокетки сзади — по этой EA-форме
#                     (цвет её кокетки: green | dark | [R, G, B]), бока — по yoke. Для кокетки «до плеча» (бока MIN 1_14_3)
#                     с краем спины прежней формы: у 1_14_3 он 1,60 м, у EA BUF 1_3_4 — 1,62 (как у прочих NHL 27). Нет — по yoke
# notch_seam        — "edge" или { форма = "edge" } (23.10, агент fix-b, NSH выезд): шов рельефа у нижнего края мыса V со щитом
#                     (collar_panel у формы с кокеткой) там, где под ним ткань: дно канавки — на краю цвета, со стороны ткани —
#                     пологий склон без валика (edge_kit.notch_edge_seam). Обычный шов давал на белом под золотом светлую кайму
#                     (нижний склон и валик смотрят вверх). К углу мыса — на нет. Нет — обычный шов (BUF, ANA, EDM…)
#                     "yoke" (NJD, 23.10) — то же по краю самой кокетки спереди (V кокетки, не шаблона), до |x| NOTCH_YOKE_X
# yoke_color, yoke_shape_color — и таблицей по форме { home = [R, G, B], away = [R, G, B] } (22.10, агент yokes: EDM — дома
#                     оранжевая кокетка на синем, в гостях синяя на белом; среднее не узнавало ни ту, ни другую); edge_kit.use_kit
# yoke_stripe       — "bands" (22.10, агент yokes, STL выезд): полосы у края кокетки над ним и под ним — профиль цвета источника
#                     по расстоянию от края (edge_kit.yoke_bands_source): в синей кокетке золотая и белая полосы, параллельно краю
#                     (22.10, агент review-c: границы полос — спереди и сзади свои, по столбцам своей стороны, на плече —
#                     переход: медиана обеих сторон сужала белую STL вдвое)
# collar_band       — { форма = "frame" } (22.10, агент yokes, NSH дом): как "full", но вставка со щитом — цветом ткани (кромка
#                     рамкой вокруг неё: золотая полоса у края, синяя кромка до V и обода, золотая вставка)
# collar_trim       — и таблицей по форме { away = "half" } (22.10, агент yokes, STL выезд: кромка цвета кокетки до V и обода
#                     срезала полосы кокетки у ворота; вне таблицы — auto)
# yoke_sleeve       — "band" (22.10, агент yokes, COL, PHI): кокетка переходит в полосу по верху рукава до манжеты — край на
#                     туловище прямой, на руке — вдоль руки по источнику (edge_kit.sleeve_band_fit), объединение гладкое,
#                     кант (yoke_stripe) — по всему краю; перенос как есть давал ступеньки канта на стыке плеча и рукава
# yoke_front        — "flat" (22.10, агент yokes, COL): край кокетки спереди ровный до вставки V (вставка цвета ткани опускала
#                     замер края — кант шёл вверх по сторонам V)
#                     "source" (22.10, агент review-c, COL): у середины ровный (как "flat"), с |x| YOKE_FLAT_X (0,14 м) к руке —
#                     край источника, не выше (у NHL 27 COL кант к пройме опускается: 1,654 → 1,613 на 0,24 м; ровный — «квадратные
#                     плечи»). Без поля перед с 0,14 м ровный, как у MIN
# yoke_specks       — true (22.10, агент review-c, EDM): точки чужого цвета (1–16 текселей 1024², вокруг — ткань, которую
#                     перекрашивает YokePaint) — тоже перекрашиваются (edge_kit.yoke_specks). У EDM сзади в кокетке оставался
#                     пунктир строчки источника (шов полосы под кокеткой NHL 27 выше нашего края). Без поля — как было
# font_plate        — true (22.10, агент yokes, PHI): фамилия на подложке — буквы атласа на непрозрачной плашке (у NHL 27 и EA
#                     PHI); растяжка букв (font_name_fit) мерит по альфе и разрушала строки — с полем атлас как у источника,
#                     высота букв стандарта спины — по цвету против плашки. Генератор ставит сам
# yoke_sleeve       — "keep" (22.10, WPG выезд): рукав целиком цвета кокетки — YokePaint не трогает рукав за швом проймы
#                     (без поля под краем кокетки «на плечо» на руке красится ткань — у MTL, BUF, DAL рукав цвета ткани)
#                     "band" (агент yokes: COL, PHI; и WPG выезд) — кокетка продолжается полосой по верху рукава, низ
#                     рукава — ткань: полоса по замеру переноса, гладко с краем кокетки (edge_kit.sleeve_band_fit)
# collar_lapel      — "source": ворот со шнуровкой (крой MIN), лацканы другого цвета — от края до шва обода, цвет
#                     источника (22.10, MTL и DAL: белые); поверх — кромка и вставка (edge_kit.LapelPaint)
#                     { форма = "source" } — только у этих форм (22.10, NYI: дома оранжевая кромка ступенькой без
#                     лацканов, в гостях синие лацканы; FLA — наоборот); у прочих форм — ворот со шнуровкой без лацканов
# lapel_clean       — true (22.10, ревью, MTL и DAL): перенос лацкана источника за краем LapelPaint у концов лацканов —
#                     тканью (edge_kit.LapelPaint.clean): иначе конец лацкана — тупой «сапожок» ниже угла вставки, край
#                     цвета на 2–5 мм ниже шва. Лацкан цвета ткани — без изменений. Нет поля — как было
# collar_panel      — (22.10) и у формы с кокеткой (BUF выезд): мыс кокетки со щитом — V шаблона, вставка — цвет внутри V
# sleeve_top24      — s NHL 24 верха полос рукава источника (число или { форма = число }; 22.10, агент plain: SJS,
#                     CAR дом; до ~0,02 за концом карты — у OTT (0,305) полосы гнулись галочкой): блок полос выше конца карты рукава Edge (~0,230) — верхняя полоса пропадала, «ткань над
#                     полосами» бралась внутри неё (SJS дом — чёрный верх рукава), а граница наискосок (OTT) не находилась
#                     совсем — без сжатия номер на рукаве ложился на полосы. Соответствие s Edge → s NHL 24 за концом
#                     рукава — продолжением по наклону (edge_kit.SleeveMap.s24_of), сжатие к кисти — до этого верха
# sleeve_stripes    — "fit" (22.10, агент review-b, OTT): края полос рукава — гладкими кривыми по кольцу
#                     (edge_kit.sleeve_stripes_fit): в строке развёртки рукава — отрезки основных цветов, край — многочлен
#                     по строкам с отсевом выбросов, следующий край — предыдущий + гладкая ширина; перекраска только у
#                     краёв. Для полос, что не сжимаются к кисти и заходят за конец карты рукава: там (переход к ближайшей
#                     точке) край рвался обрывками и ступеньками. Нет — как было
#                     "lines" (26.10, ANA; пользователь: «полоски неровные в районе чёрного клина»): края — ломаными
#                     (edge_kit.sleeve_stripes_lines: узлы по ДП, отсев выбросов, островки — цветом рисунка), швы рельефа —
#                     по ломаным. Для шеврона и полос наискосок через локоть (ANA, CAR выезд): многочлен "fit" скругляет
#                     излом дугой. Тоже таблицей по форме ({ away = "lines" })
# yoke_rgb_dist    — допуск цвета кокетки [R, G, B] (по умолчанию edge_kit.YOKE_RGB_DIST 60; 22.10, CAR дом — 15:
#                     тёмно-серая (38, 49, 51) на чёрном (27, 26, 27))
# yoke_clean_depth  — м: красное (прежняя кромка, вставка) YokePaint перекрашивает только не ниже края кокетки на столько
#                     (22.10, CAR дом: у кокетки «на плечо» зона — вся рука выше 1,45 м, красные полосы у локтя стирались)
# sleeve_fill       — "below": ткань над полосами рукава (сжатие к кисти, BOS) — цвет рукава под полосами, не над верхней
#                     (22.10, MTL дом: синяя полоса рукава почти до конца рукава — бралась белая, верх рукава белый)
# sleeve_fill_side  — true или { форма = true } (23.10, агент fix-c, SEA выезд): ткань над полосами рукава — по верхней
#                     границе полос своей руки (edge_kit.SleeveMap.stripes(side=1)); без поля граница мерится на левом
#                     рукаве, а у NHL 27 рукава бывают несимметричны — справа ткань бралась ещё внутри полосы (номер на
#                     правой руке — на бирюзе). Нет — как было
# sleeve_mirror     — "left" или { форма = "left" } (23.10, агент fix-c, SEA выезд; пользователь: «поправь — правая рука
#                     как левая»): правый рукав от манжеты до верха полос (колено сжатия к кисти + ~1 см) — зеркалом
#                     левого на развёртке Edge (u → 1 − u; цвет, рельеф — R нормали с обратным знаком — и блик), выше —
#                     переход к своему (edge_kit.sleeve_mirror). Для источника с несимметричными рукавами. Нет — как было
# brand_win         — доля развёртки: окно замера цвета логотипа источника сзади у ворота для надписи «mgrhs» (по умолчанию
#                     0,02; 22.10, BUF выезд — 0,012: в окно попадала золотая полоса под кокеткой, надпись розоватая)
# shield_offset_cm, shield_scale — щит NHL у ворота: сдвиг [x, y, z] (см, y — вверх) от места NHL 24 и масштаб
#                     (по умолчанию — как у MIN: [0,41; 0,6; 0], 0,88)
# shield_gap_mm     — щит по зазору под кромкой (21.10, вместо подбора shield_offset_cm): мм от низа кромки ворота
#                     посередине переда до верха щита (как «до кромки» у kitport check); число, { home = …, away = … }
#                     или "source" (зазор источника). Сдвиг по высоте edge_kit считает до сборки (fit_shield_gap).
#                     Нет ни его, ни shield_offset_cm, ворот plain — edge_kit.SHIELD_GAP_DEFAULT_MM (4 мм: решение
#                     пользователя по NJD/TBL). Задан shield_offset_cm — как раньше
# Раздел клуба из NHL 27 собирает генератор: python -m kitport profile --club КОД [--write] (docs/kitport.md §12.3)
# hem_h             — м: высота зоны низа «от края» (fb.hem: полосы низа идут вдоль края одной толщины), выше — переход
#                     3 см к переносу по высоте; без поля — 0,09. Генератор ставит, если полосы низа выше 5 см:
#                     верх полос + 4 см (BOS 21.10: белая полоса в переходе раздувалась посередине)
# name_zone_lift_cm — зона фамилии выше на спине на столько см (edge_kit.lift_name_zone; SEA 2,4)
# font_name_fit     — "auto": буквы фамилии в клетках и зона — расчётом (edge_kit.name_font_fit): высота букв в игре
#                     как у MIN, промежуток ≤ NAME_FIT_GAP высоты буквы; вместо font_name_scale и name_zone_scale
#                     "measured" (22.10, агент review-b, SJS) — то же и проверка по готовому атласу (edge_kit.name_fit_measured):
#                     растяжка сглаживает край буквы — по альфе она уже на 1–1,5 px, промежуток выходил 0,24; пересчёт от
#                     исходного атласа, пока промежуток не ≤ NAME_FIT_GAP (как меряет kitport lettering)
# letter_zone_shift_cm — [наружу, вверх] см: места буквы капитана (5, 7) сдвинуты по груди (edge_kit.shift_zones; VGK)
# letter_zone7_shift_cm — [наружу, вверх] см (23.10, агент fix-a, NYR): только второе место буквы (зона 7) — с надписи-
#                     герба на чистую ткань (у NYR оно лежало на «R» RANGERS; kitport audit). Место C (5) и герб — как были
# letter_zone_scale — число (26.10, DET): места буквы капитана (5, 7) мельче в k раз у их середины (буква мельче),
#   [crest_fit] — по уменьшенным местам, герб растёт до них (edge_kit.LETTER_ZONE_SCALE)
# collar_trim       — auto | step | smooth | half: half — полоса спереди, скос на 79° (edge_kit.HALF_STEP_AT), сзади — обод
# collar_lining     — source | trim: подворот ворота — цвет NHL 27 или цвет кромки (VGK — trim, как LAK)
# top_proj          — [от, до] y нормали (22.10, NYR выезд): с какого наклона верх плеча переносится проекцией сверху
#                     (по умолчанию 0,55–0,8); выше — у полос через плечи у ворота (смесь двух систем гнула их петлями)
# sleeve_blend      — u (22.10, WSH): ширина перехода карты рукава (SleeveMap) к ближайшей точке у проймы (по умолчанию
#                     0,007): у панели вдоль руки на стыке карт край ступенькой; шире — наклонно
# collar_panel      — true: ворот V спереди (острие посередине, edge_kit.panel_v) — шов, у кромки во весь V и её край
# trim_clear        — "angle" (22.10, CHI, UTA дом): зачистка за кромкой — цветом источника по углу (edge_kit.trim_body_by_angle):
#                     у NHL 27 за узкой кромкой сбоку и сзади вторая полоса до шва обода, спереди — ткань; одним цветом
#                     «ткани у ворота» (замер 2–3,5 см сбоку — цвет полосы) по всему переду шла черта. Чистит только
#                     остатки кромки (пиксели ближе к её цвету): полоса и ткань — как перенеслись. Нет — одним цветом
# collar_band       — { форма = "full" | "back" } (22.10): двухцветный ворот. У края — полоса шаблона (BAND_KNOTS) цветом края
#                     источника, поверх кромки (кроме вставки со щитом); за ней — второй цвет источника (COLLAR_BAND_D):
#                     "full" — во всю ширину кромки, ширина — сплошной «полоса + второй цвет» от края (UTA выезд: белая
#                     полоса, голубой V и обод, щит на голубом); "back" — только широкая часть ступеньки сзади (TOR дом:
#                     синяя полоса по кругу, белое сзади до обода). Генератор ставит "full" вместо trim_width_from
# crest_size_cm     — герб не меньше стольких см (√(ширина × высота) рамки; edge_kit.crest_to_size), потом [crest_fit]
# name_arch         — true: у фамилии ширина и форма своей зоны (дуга, DET); иначе ширина стандартная (LETTERING_NAME_X)
# yoke_mesh         — false: без сетки ямок в кокетке (по умолчанию true — как у MIN NHL 24; у NHL 27 MTL, DAL, BUF её нет)
# lettering         — standard (по умолчанию) | own: стандарт спины (edge_kit.standard_lettering, 22.10 — фамилия 7,2 см,
#                     номер 30 см, верх фамилии 1,580 м или на 2,7 см ниже кокетки сзади, шрифт фамилии расчётом)
# digit_gap         — промежуток между цифрами номера (видимый край к краю) к высоте цифры: число или { форма = … }
#                     (24.10, пользователь: «расстояние между цифрами можно ближе у всех — сравни с фото настоящих»;
#                     edge_kit.digit_spacing). Значение — замер фото настоящих форм (источник — в комментарии клуба); нет
#                     поля — edge_kit.DIGIT_GAP 0,052 (медиана замеров). Знаки цифр шире в клетках атласа, зона номера на
#                     спине уже в той же мере (ширина цифры в игре прежняя), номер на рукаве — так же (малые цифры, зоны 2, 3)
# digit_aspect      — ширина цифры номера в игре: "keep" (по умолчанию — как до 24.10, одобрено) или число — множитель к
#                     пропорции шрифта источника (настоящие цифры на фото анфас — медиана ×1,05 атласа NHL 27; «keep» — ×1,16–1,47)
# name_zones_from   — форма Legacy, с карты номеров которой зоны фамилии, номера и буквы (0, 1, 5, 7; VGK — MIN 1_14_4;
#                     UTA — свой образец 1_104_0: шаблон стадии kit у 3-значного арта — 1_131_0 с другими местами буквы)
# armhole_split     — zones | full: деление цвета рукав / туловище по шву проймы Edge — внизу проймы (zones) или
#                     целиком (full — рукав другого цвета, VGK)
#                     или таблицей по форме { away = "full" } — у форм вне таблицы zones (22.10, CAR: в гостях красные
#                     рукава на белом, дома тёмная кокетка заходит с плеч на руку — шов по всей пройме резал её)
# name_zone_scale   — зона фамилии в карте номеров ниже в столько раз, верх на месте (edge_kit.scale_name_zone): игра
#                     вписывает фамилию в зону — мельче и буквы, и промежутки
# font_name_anchor  — привязка знака при font_name_scale: center | top (верх букв на месте)
# hem_shift_cm      — см: полосы низа ниже на столько (рисунок низа с высоты d + сдвиг)
# torso_shift       — [см, y0, y1, y2, y3] или { форма = [...] } (23.10, пользователь, MTL дом): рисунок туловища и герб
#                     ниже на столько — полоса через туловище (на ней герб спереди и номер сзади) проходит посередине
#                     номера. Высоты Edge, м: с y0 до y1 сдвиг растёт, до y2 — весь, к y3 — на нет (спад не короче
#                     1,5 × сдвига). Края — по ткани одного цвета (edge_kit.torso_shift_dy)
# font_name_scale   — буквы фамилии в атласе шрифта крупнее в своих клетках (fb.fonts.scale_glyphs): крупнее и плотнее
#                     фамилия на спине; font_captain_x — буквы капитана C и A шире. Нет — атлас как у источника
# crest_fit         — поля правила «герб не на букву капитана» ([crest_fit] kit_rules.toml) для клуба: gap_min, max_bottom…
# insert            — формы с вставкой под воротом (V-вырез adidas), рисуется заново (InsertPaint)
# insert_color      — "source": цвет вставки — замер источника внутри её контура (любой цвет; 22.10, TOR: шнуровка
#                     как у MIN, вставка цвета ткани — кромка кончается у вставки). Нет — красное вставки NHL 24 (MIN)
# insert_clean      — "blend" (22.10, NYI): прежний перенос вокруг вставки перекрашивается и в смеси её цвета с тканью
#                     (без поля — только почти цвет вставки: пунктир и «крючки» у нижнего края цветной вставки)
# letter_zones_from — форма → форма, с карты номеров которой берутся зоны буквы капитана (MIN: у выездной EA ниже)
# sleeve_zones_from — форма Legacy, с карты номеров которой зоны номеров на рукавах (2, 3); по умолчанию — домашняя MIN
#                     1_14_4 (общее правило 21.10: номер на плече — там же, где у MIN), "own" — с карты образца
# sleeve_zone_shift_cm — [наружу, вверх] см или { форма = [...] } (23.10, пользователь; OTT, WPG): зоны номеров на
#                     рукавах сдвинуты (edge_kit.shift_zones) — номер мимо полос; выше ~5 см зона выходит за развёртку
#                     рукава. sleeve_zone_scale — зоны в k раз (edge_kit.scale_zones)
# audit_accept      — проверки kitport audit, принятые у клуба (sleeve_mix, letter_out, …; tools/kitport/audit.py) — с причиной
# number_h_cm       — высота номера на спине, см (23.10, пользователь после игры; стандарт — 30, edge_kit.LETTERING_NUM_H)
# chest_zone_scale  — k (23.10, агент fix-a, BUF): зона 6 карты номеров — номер на груди (есть только у карт EA BUF
#                     1_3_2, 1_3_4: у формы 2010–13 номер слева на груди) — в k раз, верх на месте (edge_kit.scale_zones,
#                     anchor top); в выводе slot — зазор до верха герба в строках карты 256² (было → стало). У герба
#                     27 см низ зоны лежал на его верху (пользователь: «номер на груди поменьше или лого пониже»).
#                     Нет — как было
# sleeve_zone_z_cm  — номера на рукавах к груди (> 0) или к спине, см (23.10; edge_kit.zones_move_z)
# sleeve_zone_at    — [|x|, y] м (23.10, пользователь, ANA): середина зон номеров на рукавах — на точку свитера (вокруг
#                     руки к верху, edge_kit.zones_to_point): sleeve_zone_shift_cm ведёт зону вдоль руки, высота почти та же
# sleeve_zones_at   — "shoulder" (22.10, FLA — исключение из правила выше): зоны 2/3 — на верх плеч у ворота, где у
#                     MIN NHL 24 плечевые нашивки (edge_kit.SHOULDER_ZONE_UV), размер в см — как у зоны рукава
# sock_parts        — свои ровные полосы гетр (sock = flat): [доля, [R, G, B]], первая строка — ткань (доля 0)
# merge_parts       — нашивки из нескольких связных частей — одной (fb.kit_hybrid.merge_parts): ["crest"] — герб TBL
#                     (молния и кольцо порознь уменьшались [crest_fit]). Нет — как было (часть = нашивка)
# merge_near        — доля развёртки (22.10, UTA выезд «UTAH»): части вне правил ближе этого к группе merge_parts (по
#                     цепочке, буква к букве) — в неё же (fb.kit_hybrid.near_parts): U и H дальше match_radius от uv герба
#                     шли отдельными нашивками без [crest_fit]. Нет — как было
# base_normal_decals — "flat": рельеф нашивок, «запечённый» EA в _base_normal источника, выровнять по маске
#                     «готовый − основа» (TBL ten: YMCA и молния герба — двойной контур у сдвинутого герба). Нет — как было
# yoke_band_skip    — [d от, до] м от манжеты (23.10, review-d, WPG выезд): зона полос рукава не в замер полосы по верху рукава
#                     (yoke_sleeve = "band"): в полосах цвета кокетки замер рвался, сглаживание сужало полосу выше них
# yoke_band_seam    — м от плеча (по умолчанию 0,18): ближе замер полосы рукава не берётся (WPG — 0,06)
# base_normal_keep_lace — true (23.10, review-d, NYI): base_normal_decals не выравнивает зону шнуровки (LACE_ZONE на сетке
#                     источника): иначе маска щита и вставки накрывала люверсы и шнурки — шнуровка без рельефа
# piping_fit        — [u0, v0, u1, v1] или { форма = [...] } (23.10, агент review-d, CBJ, WSH): окно развёртки (как у левого
#                     рукава, правый — зеркально) — кант вдоль руки у шва проймы гладкими кривыми (edge_kit.piping_fit): там кант
#                     идёт по u поперёк шва, а перенос и armhole_clean давали его краю лесенку по 3–6 текселей. Нет — как было
#                     Список окон [[…], […]] (26.10, CBJ: и верхний кант ленты рукава) — окна по очереди
# sleeve_along      — [u0, v0, u1, v1], список окон или { форма = … } (26.10): края лент, панелей и кантов ВДОЛЬ руки
#                     (WSH — панель с кантом, WPG выезд — тёмно-синий клин) — ломаными по столбцам u
#                     (edge_kit.sleeve_along_lines; окно — как у левого рукава, до шва проймы; столбцы с поперечными
#                     полосами и нашивками — как есть), швы рельефа — по ним. Нет — как было
# sleeve_stripes_frac — число (26.10, NSH): порог палитры sleeve_stripes = "fit" / "lines" — доля рукава (по умолчанию
#                     0,04): тонкие нитки (~2 %) иначе не в палитре — строки с ними не в замер
# armhole_aa        — true (23.10, review-d, WSH): у armhole_split = "full" край рукава по шву проймы — смесью по доле текселя
#                     (без поля — зубцы в тексель: край белой панели WSH у плеча)
# piping_mix        — true (23.10, агент review-e, WSH): к piping_fit — тексель смеси у края канта не «чужой»: фон над / под
#                     кантом — не по текселю смеси (у WSH дома фон под кантом у подмышки — «красный», красная чёрточка
#                     1–4 текселя на белой панели обеих рук), смесь фона с кантом на краю — по гладкому краю (светлые
#                     зубцы в тексель). edge_kit.PIPING_MIX. Нет — как было
# island_pad_cm     — true или { форма = true } (23.10, агент review-e, NYR выезд): поле вокруг острова развёртки (перед
#                     ворота) и в jersey_cm — цветом ближайшего текселя острова, как рельеф (edge_kit.pad_island). Без поля
#                     там цвет до chest_bands: на шве острова фильтрация тянула его на свитер — синяя точка и черта под
#                     синей полосой у |x| 11 см, белая чёрточка в кокетке у ±14 см. Нет — как было
# insert_contour    — "nhl27" (23.10, агент review-e, FLA): контур вставки под воротом — как у шаблона adidas NHL 27
#                     (edge_kit.INSERT_HW_NHL27_FULL): язычок до 1,591 м между нижними шнурками, шейка ±0,8 см под
#                     верхними; стороны V, угол и верх — как INSERT_HW_NHL27; у шнуровки красятся только ткань, вставка и
#                     их смесь (края шнурков и тени — как есть). Без поля при insert_color = "source" — INSERT_HW_NHL27
#                     (острие на 1,604: решение по DAL, у TOR, MTL, DAL)
# yoke_mix_keep     — true (23.10, review-d, WPG выезд): смесь «кокетка — ткань» рядом с полосами другого цвета YokePaint не
#                     перекрашивает (серебристые каёмки голубых полос рукава WPG — такая смесь; при yoke_sleeve = "band" пропадали)
# brand_y           — м (23.10, review-d, CBJ): центр надписи «mgrhs» сзади на этой высоте (по умолчанию REEBOK_BACK_UV, 1,663:
#                     у CBJ там белая полоса под кокеткой — надпись на полосе; у NHL 27 логотип выше, в кокетке)
# chest_bands       — [|x| от, до, высота от, до] (м) или { форма = [...] } (23.10, review-d, NYR выезд): полосы через грудь у
#                     ворота — края по замеру источника по углу (edge_kit.chest_bands_fit): переносом у ворота петли и «глазки»
# pant_merge_px     — тексели 2048² (23.10, review-d, WSH): части нашивки шорт ближе — одной наклейкой (три звезды WSH шли
#                     в место герба EA порознь — одна крупная звезда; fb.pant_decals.MERGE_PX). Нет — как было
# pant_decal_ymax   — м (23.10, review-d, WPG): нашивка шорт с центром выше на сетке источника — не нашивка (пояс под свитером:
#                     у WPG обрывки у шнурка пояса шли в места гербов EA — пятна на ногах; fb.pant_decals.Y_MAX). Нет —
#                     1,05 (Y_MAX_DEFAULT, 24.10: у DAL лого с пояса NHL 27 шло вторым гербом на другую ногу)
# pant_hem          — м (23.10, агент fix-a, NYR): полосы по низу штанин — от края штанины до этой высоты (fb.pant_decals.hem:
#                     тексель Legacy берёт цвет источника с тем же углом вокруг ноги и той же высотой над краем; выше —
#                     переход 3 см к переносу). Шорты Legacy короче и с подворотом: переносом полосы низа NHL 27 рвались
#                     на клочки (пользователь, 23.10: «артефакты на трусах»). Нет — как было
# name_contrast     — false или { форма = false } (23.10, агент fix-a, NYR дом): буквы фамилии — цветом источника, без
#                     pilot.name_contrast (красные с белой тенью на синем перекрашивались в белые: «шрифт простой, а должен
#                     быть специфический», пользователь). Нет — как было (буквы цвета свитера — заливкой цифр / белым)
# [клуб.slot.<форма>] — форма в игре:
#   kit         — имя в реестре tools/legacy_data/nhl24_kits.json (nhl24.py alloc КЛУБ edge_home edge_away --style 0)
#   legacy      — форма-образец Legacy: карта номеров и (по умолчанию) шорты, гетры, наклейка на шлем
#   sock        — flat (sock_parts), legacy (гетры образца, полоса — в строки flat другой формы клуба),
#                 auto (ровные полосы по гетрам источника этой формы: цвета и доли — по строкам)
#   pant        — legacy (шорты образца) | source (шорты источника, 3D-перенос fb.pilot; нашивки — по правилу ноги
#                 fb.pant_decals.LEG_SLOTS на шортах полевых в игре, 24.10)
#   helmet_logo — legacy (наклейка образца) | source (helmetlogo источника, 256×128)
# helmet_logo_x  — число (26.10, ANA): наклейка шлема из источника у́же по ширине в k раз (edge_kit.helmet_squeeze;
#   у ANA helmetlogo NHL 27 шире той же эмблемы на свитере в 1,228 раза)
#   label       — подпись в меню; по умолчанию «Home (NHL 27)» / «Away (NHL 24)» — форма и источник (правило 21.10)
#   default     — true: одобрена пользователем — форма по умолчанию дома (выезда); прежняя по умолчанию — в список
#                 с подписью (правило 21.10: «одобрил — сразу по умолчанию»). Подпись тогда в меню стандартная Home / Away

[MIN]
source = "nhl24"
yoke_color = "green"
yoke = { away = "1_14_3" }
insert = ["away", "home"]
letter_zones_from = { away = "home" }
sleeve_zones_from = "own"           # номера на рукавах — с карт своих образцов (они и есть образец для остальных)
# щит меньше и чуть ниже (пользователь, 21.10: «для Миннесоты тоже можно уменьшить, довольно большой»; было 0,88, y 0,6:
# щит 1,617–1,643 м, кромка с 1,644)
shield_offset_cm = [0.41, 0.45, 0.0]
shield_scale = 0.76
sock_parts = [[0.0, [24, 56, 46]], [30, [214, 203, 165]], [30, [159, 14, 10]], [110, [214, 203, 165]]]

[MIN.slot.home]
kit = "edge_home"
legacy = "1_14_4"
sock = "flat"
pant = "legacy"
helmet_logo = "legacy"
default = true                      # одобрено (пользователь, 21.10)

[MIN.slot.away]
kit = "edge_away"
legacy = "1_14_3"
sock = "legacy"
pant = "legacy"
helmet_logo = "legacy"
default = true

# NJD — из NHL 27 (пользователь, 21.10: «свитер, гетры, трусы, шлем» — всё из NHL 27). Кокетка чёрная у обеих форм. Цвет каски — tools/legacy_data/nhl24_helmets.json
# (из stockteamequipmenttable NHL 27: дом — чёрная, выезд — светлая).
[NJD]
source = "nhl27"
yoke_color = "dark"
body_color = "back"
collar = "plain"
# кокетка «до плеча», как у новой формы MIN (пользователь, 21.10: «чёрные полоски на плечах должны заканчиваться на
# плечевом суставе», у EA-форм NJD 1_17_x она заходит на руку, и сбоку была «лесенка» — спина ниже переда)
yoke = { home = "1_14_3", away = "1_14_3" }
yoke_shape_color = "green"
# щит — по середине чёрного мыса, меньше: чёрное и сверху (до красной кромки), и снизу (пользователь, 21.10, дважды:
# при 0,88 щит 1,618–1,643 м, при 0,75 и −0,35 см — 1,617–1,639, кромка с 1,642: сверху чёрного 3 мм; чёрное
# 1,607–1,642 → 0,68 и ещё −0,35 см — щит ≈ 1,615–1,634, по ~7–8 мм сверху и снизу)
shield_offset_cm = [0.41, -0.10, 0.0]
shield_scale = 0.68
insert = []                         # вставки под воротом у NJD нет (ворот — красная кромка по чёрной кокетке): InsertPaint
#                                     красил «шнурки» чёрным и закрывал щит NHL у выездной (21.10)
notch_seam = "yoke"   # край кокетки V над тканью — без светлой каймы (пользователь, 23.10: «да»; мыс — край кокетки, не шаблона)
letter_zones_from = {}
sock_parts = [[0.0, [0, 0, 0]]]
digit_gap = 0.056   # 24.10 (агент digits): промежуток цифр номера (видимый край к краю) к высоте цифры —
#   фото: Mercer 91 белая, почти анфас (пара с «1» — промежуток к высоте напрямую); замер — game/work/digits-real (docs/kitport.md §12.1)

[NJD.slot.home]
kit = "edge_home"
legacy = "1_17_0"
sock = "auto"
pant = "source"
helmet_logo = "source"
default = true                      # одобрено (пользователь, 21.10: «формы готовы», после правок — по умолчанию)

[NJD.slot.away]
kit = "edge_away"
legacy = "1_17_1"
sock = "auto"
pant = "source"
helmet_logo = "source"
default = true

# TBL — из NHL 27 (агент, 21.10): нынешние формы — ten / eleven (по базе NHL 27; home / away — прежние, с другим шрифтом,
# у ten / eleven — реклама на груди: YMCA дома, AdventHealth на выезде — снимается правилом [sponsor] kit_rules.toml).
# Ворот без шнуровки, кокетки нет (группа 1, docs/kitport.md §12.2). Цвет каски — tools/legacy_data/nhl24_helmets.json.
[TBL]
source = "nhl27"
source_kits = { home = "ten", away = "eleven" }
body_color = "back"                 # дом — синяя ткань (light взял бы белые полосы); у TBL без кокетки и вставки не влияет
collar = "plain"
# щит (агент, 21.10): x 0,41 — середина горловины adidas левее оси (как у всех); размер — как у NJD (0,68: у MIN 0,76,
# «довольно большой» при 0,88, пользователь). Высота: кромка (TrimPaint) на середине кончается ~1,635 м, щит на месте
# NHL 27 (y 0) заходил на неё; подбор по kitport check: y 0 → −0,3 → −0,5 → −0,7 → −0,9 (0,76: зазор дома ~1,5 мм,
# на выезде щит у самой синей кромки; сдвиг щита по наклонной груди — ~0,7 от y) → 0,68 и −1,1. Цель — поле ~3 мм
# под кромкой, как у NJD (правило MIN и NJD — «под кромкой», с полем сверху); у оригинала NHL 27 — полоска ткани
shield_offset_cm = [0.41, -0.20, 0.0]         # 21.10: кромка ступенькой — щит выше (при −1,1 было 14 мм до кромки);
#                                                +0,3 — «чуть пониже» (пользователь) → −0,2

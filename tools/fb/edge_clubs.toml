# docs/kitport.md §12.6; одобрения нет (default) — его ставит пользователь.
default = true
[BUF]
source = "nhl27"
source_kits = { home = "ten", away = "eleven" }
body_color = "back"   # середина спины ровная на 100% (back — как NJD, TBL; light — только MIN)
collar = "plain"   # под щитом посередине переда не цвет ткани: home 0.00, away 0.00 (порог 0.15; шнуровка — больше)
trim_measure = "contiguous"   # ширина кромки — сплошной полосой от края по основе (edge_kit.TRIM_MEASURE)
crest_fit = { gap_min = 0.008 }   # герб крупнее: до буквы капитана 0,008 развёртки (~0,6 см), как TBL, BOS, DET
crest_size_cm = 27   # герб не меньше 27 см (√ ширина × высота), как EA-гербы NHL 13 (edge_kit.crest_to_size)
# выезд (агент yoke, 22.10): кокетка «на плечо» — синяя шапка заходит на руку, край на руке — прямая наискосок
# (yoke_side_blend); спина — по EA-форме выезда 1_3_4 (1,62 м; у NHL 27 — 1,66: «кончается высоко», как MIN NHL 24);
# цвет — синий NHL 27 (green/dark узнавали его случайно), под кокеткой — золотая полоса ~0,9 см (yoke_stripe);
# мыс со щитом — V шаблона ворота (collar_panel у обеих форм: ворот без шнуровки — общий шаблон)
yoke_color = [24, 46, 126]
yoke = { away = "1_3_4" }
yoke_shape_color = [30, 33, 57]   # синий EA 1_3_4 (её спина — край кокетки сзади)
yoke_side_blend = 0.10
yoke_stripe = "source"
brand_win = 0.012   # цвет логотипа сзади — только сам логотип (в окне 0,02 у выезда — и золотая полоса: «mgrhs» розоватая)
collar_panel = true   # шаблон ворота NHL 27; у выезда мыс кокетки — вставка V (цвет — внутри V, синий)
shield_scale = 0.68   # щит по зазору под кромкой — edge_kit.SHIELD_GAP_DEFAULT_MM; у источника 5.4 мм / 5.4 мм (справка)
hem_h = 0.22   # м: зона низа «от края» выше полос (fb.hem.HEM_H; без поля — 0,09)
insert = []
number_h_cm = 27   # номер на спине 27 см вместо 30 (пользователь после игры, 23.10: «номера на спине поменьше»); промежутки цифр — в той же мере
notch_seam = "edge"   # мыс V со щитом над тканью — без светлой каймы (пользователь, 23.10: «да» — как у NSH выезда)
letter_zones_from = {}
font_name_fit = "auto"   # фамилия: высота как у MIN, промежуток ≤ 0,23 высоты буквы (edge_kit.name_font_fit)
sock_parts = [[0.0, [0, 0, 0]]]   # не используется (sock = auto)

yoke_mesh = false   # у NHL 27 на плечах сетки нет (22.10: «волнистая хуетень вокруг белой обводки» — край сетки ямок)
chest_zone_scale = 0     # номера на груди нет (пользователь, 23.10: «убери» — у NHL 27 его нет); было 0.8 — 23.10, агент fix-a («номер на груди поменьше или лого пониже»): номер на груди (зона 6 карты EA
#   1_3_x) 20×15 → 16×12 строк карты (~9 → ~7 см), верх на месте — низ на ~1,2 см выше герба (было — на гербе); герб
#   (одобрен, 27 см) не трогал. У NHL 27 номера на груди нет — убрать совсем можно картой без зоны 6 (вопрос пользователю)
[BUF.slot.home]
kit = "edge_home"
legacy = "1_3_2"
sock = "auto"
pant = "source"
helmet_logo = "source"
default = true                      # поставлено в игру (пользователь, 22.10: «останови всё на том, что есть, и добавь в игру»)

[BUF.slot.away]
kit = "edge_away"
legacy = "1_3_4"
sock = "auto"
pant = "source"
helmet_logo = "source"

# DAL — из NHL 27, профиль собран генератором (python -m kitport profile --club DAL, 22.10.2026).
# Нынешние формы — ten / eleven (база NHL 27). Решения «проверить» — в выводе генератора и
# docs/kitport.md §12.6; одобрения нет (default) — его ставит пользователь.
# Правки агента yoke (22.10, по рендеру источника на сетке NHL 24): ворот у обеих форм — шнуровка, крой MIN (полоса,
# лацканы, вставка V со щитом, планка с люверсами): кромка чёрная (спереди 1 см, сзади до 1,8), лацканы до шва обода —
# белые, вставка — дома чёрная, в гостях зелёная (мыс кокетки), шнурки белые. Кокетка выезда — зелёная «на плечо».
# «Белый лацкан со шнуровкой» дома (§12.2, особые) — тем же кроем MIN с лацканами (collar_lapel), не отдельный случай
default = true
[DAL]
source = "nhl27"
source_kits = { home = "ten", away = "eleven" }
body_color = "back"   # середина спины ровная на 100% (back — как NJD, TBL; light — только MIN)
collar = "lace"   # шнуровка у обеих форм (генератор: plain — доля «не ткани» под щитом home 0.40, away 0.08)
trim_measure = "contiguous"   # ширина кромки — сплошной полосой от края по основе (edge_kit.TRIM_MEASURE)
crest_fit = { gap_min = 0.008 }   # герб крупнее: до буквы капитана 0,008 развёртки (~0,6 см), как TBL, BOS, DET
crest_size_cm = 27   # герб не меньше 27 см (√ ширина × высота), как EA-гербы NHL 13 (edge_kit.crest_to_size)
yoke_color = [10, 99, 66]   # зелёная кокетка NHL 27
yoke = { away = "1_9_4" }   # «на плечо»: край спины — по EA-форме выезда 1_9_4
yoke_shape_color = [0, 111, 74]
yoke_side_blend = 0.10   # край на руке — одна прямая наискосок от переда к спине (рисунок пользователя 21.10)
insert = ["away", "home"]   # вставка V под воротом (InsertPaint, как MIN и TOR): цвет — источника
insert_color = "source"
collar_lapel = "source"   # лацканы белые — от кромки до шва обода (LapelPaint)
lapel_clean = true   # 22.10, ревью (агент review-a): дома конец лацкана «сапожком» — белый перенос источника на 5 мм ниже
#                      угла вставки и срез по её боку; за краем лацкана — тканью (у NHL 27 — острый угол в угол вставки)
insert_clean = "blend"   # 22.10, ревью: выезд — зелёный пунктир в 2–3 мм под нижними краями вставки (смесь переноса), как NYI
shield_offset_cm = [0.41, 0.45, 0.0]   # щит на вставке — место и размер MIN (ворот со шнуровкой, как TOR)
shield_scale = 0.76
hem_h = 0.205   # м: зона низа «от края» выше полос (fb.hem.HEM_H; без поля — 0,09)
letter_zones_from = {}
font_name_fit = "auto"   # фамилия: высота как у MIN, промежуток ≤ 0,23 высоты буквы (edge_kit.name_font_fit)
sock_parts = [[0.0, [0, 0, 0]]]   # не используется (sock = auto)

yoke_mesh = false   # у NHL 27 на плечах сетки нет (22.10: «волнистая хуетень вокруг белой обводки» — край сетки ямок)
[DAL.slot.home]
kit = "edge_home"
legacy = "1_9_3"
sock = "auto"
pant = "source"
helmet_logo = "source"
default = true                      # поставлено в игру (пользователь, 22.10: «останови всё на том, что есть, и добавь в игру»)

[DAL.slot.away]
kit = "edge_away"
legacy = "1_9_4"
sock = "auto"
pant = "source"
helmet_logo = "source"

# MTL — из NHL 27, профиль собран генератором (python -m kitport profile --club MTL, 22.10.2026).
# Нынешние формы — ten / eleven (база NHL 27). Решения «проверить» — в выводе генератора и
# docs/kitport.md §12.6; одобрения нет (default) — его ставит пользователь.
# Правки агента yoke (22.10, по рендеру источника на сетке NHL 24): ворот у обеих форм — шнуровка, крой MIN (полоса,
# лацканы, вставка V со щитом, планка с люверсами): кромка тёмно-синяя ~1 см, лацканы до шва обода — белые, вставка —
# цвета ткани (дома красная, в гостях белая), шнурки белые. Кокетка только у выезда — красная «на плечо»; у дома
# генератор видел кокетку из-за синей полосы на спине (замер «ткани» попал на неё), рукав «другого цвета» — тоже
default = true
[MTL]
source = "nhl27"
source_kits = { home = "ten", away = "eleven" }
body_color = "back"   # середина спины ровная на 63% (back — как NJD, TBL; light — только MIN)
collar = "lace"   # шнуровка у обеих форм (генератор: plain — под щитом цвет вставки = ткани: home 0.19, away 0.02)
trim_measure = "contiguous"   # ширина кромки — сплошной полосой от края по основе (edge_kit.TRIM_MEASURE)
crest_fit = { gap_min = 0.008 }   # герб крупнее: до буквы капитана 0,008 развёртки (~0,6 см), как TBL, BOS, DET
crest_size_cm = 27   # герб не меньше 27 см (√ ширина × высота), как EA-гербы NHL 13 (edge_kit.crest_to_size)
placket_lift_cm = 1.4   # 23.10: один шнурок (1,594 м) — низ планки на 1,66 см ниже него, как у MIN под нижним (edge_kit.PLACKET_LIFT)
lace_zone = [0.027, 1.586, 1.617]   # рельеф источника — только шнурок, люверсы, язычок: панель NHL 27 (бока ±3,2 см) двоилась с планкой
relief_flat_under = ["crest", "numbers"]   # 23.10, пользователь: швы полосы видны на гербе и номерах — там гладко
crest_rotate_deg = { home = 0.32 }   # 23.10: куски полос в гербе слева выше полосы, справа ниже (~1,5 мм на 27 см) — доворот против часовой
crest_level = ["home"]   # 23.10: герб проекцией по высоте — у концов «C» рисунок не сползает ниже полосы (edge_kit.crest_level)
crest_drop_cm = { home = 0.28 }   # 23.10: куски полос в нашивке герба выше нашей полосы — герб ниже (torso_shift двигает его вместе с полосой);
#   0,2 — справа у конца «C» сошлось, слева волосок ~1,5 мм; 0,35 — слева сошлось, справа белый волосок над синим концом;
#   0,28 — посередине: остаток меньше текселя (текстура 1024 — ~1,4 мм на тексель спереди)
torso_shift = { home = [3.57, 1.15, 1.21, 1.45, 1.52, 1.118, 1.333] }   # полоса с гербом ниже на 3,57 см и выше в 1,118 раза
#   (23.10, после игры: «края у буквы не состыковываются с линиями на форме» — куски полос в нашивке герба: верхняя
#   каёмка на 2–4 мм выше нашей, нижняя — на месте; было [4.0, …, 1.102]: полоса выше на 2,4 % от низа — 3,85 и 1,128;
#   с crest_level (концы «C» — без сползания по глубине) куски в гербе на ~3 мм выше полосы сверху и снизу — 3,57 и 1,118)
#   вокруг середины номера (пользователь, 23.10: «из-за увеличения лого не стыкуются полоски» — герб ×1,102 до 27 см,
#   полоса — так же, каёмки полосы снова в кольце «C»). Ниже на 4 см (пользователь, 23.10: «в жизни
#   полоса проходит посередине номера, сейчас выше середины»): сзади полоса была 1,306–1,44 м (середина 1,373), номер
#   1,179–1,486 (середина 1,333); спад 1,45–1,52 — до сдвига кокетки (DELTA_Y 1,52), низ 1,15–1,21 — ткань
yoke_color = [134, 18, 21]   # красная кокетка NHL 27 (ни green, ни dark)
yoke = { away = "1_15_1" }   # «на плечо»: край спины — по EA-форме выезда 1_15_1 (1,61 м; у NHL 27 — 1,65)
yoke_shape_color = [134, 18, 21]
yoke_side_blend = 0.10   # край на руке — одна прямая наискосок от переда к спине (рисунок пользователя 21.10)
insert = ["away", "home"]   # вставка V под воротом (InsertPaint, как MIN и TOR): цвет — источника
insert_color = "source"
collar_lapel = "source"   # лацканы белые — от кромки до шва обода (LapelPaint)
lapel_clean = true   # 22.10, ревью (агент review-a): дома конец лацкана «сапожком» — белый перенос источника на 5 мм ниже
#                      угла вставки и срез по её боку; за краем лацкана — тканью (у NHL 27 — острый угол в угол вставки)
shield_offset_cm = [0.41, 0.45, 0.0]   # щит на вставке — место и размер MIN (ворот со шнуровкой, как TOR)
shield_scale = 0.76
hem_h = 0.17  # м: зона низа «от края» — полосы выезда до 13 см (+4); у дома генератор брал за полосы низа синюю полосу
#               груди (30 см) — в зоне «от края» она шла бы по краю низа Edge (на 1–1,5 см волной)
sleeve_fill = "below"   # дом: синяя полоса рукава — почти до конца рукава; над полосами (после сжатия к кисти) — ткань рукава
#                         под ними, красная (сборка 1: бралась белая полоса над синей — верх рукава белый)
letter_zones_from = {}
font_name_fit = "auto"   # фамилия: высота как у MIN, промежуток ≤ 0,23 высоты буквы (edge_kit.name_font_fit)
sock_parts = [[0.0, [0, 0, 0]]]   # не используется (sock = auto)

yoke_mesh = false   # у NHL 27 на плечах сетки нет (22.10: «волнистая хуетень вокруг белой обводки» — край сетки ямок)
[MTL.slot.home]
kit = "edge_home"
legacy = "1_15_0"
sock = "auto"
pant = "source"
helmet_logo = "source"
default = true                      # поставлено в игру (пользователь, 22.10: «останови всё на том, что есть, и добавь в игру»)

[MTL.slot.away]
kit = "edge_away"
legacy = "1_15_1"
sock = "auto"
pant = "source"
helmet_logo = "source"

# TOR — из NHL 27, профиль собран генератором (python -m kitport profile --club TOR, 22.10.2026).
# Нынешние формы — ten / eleven (база NHL 27). Решения «проверить» — в выводе генератора и
# docs/kitport.md §12.6; одобрения нет (default) — его ставит пользователь.
# Ворот (агент tor, 22.10, по рендеру основы с base_normal на сетке NHL 24): у обеих форм NHL 27 шнуровка — планка,
# люверсы, шнурки (дома белые на синем, в гостях белые на белом), V-вставка под воротом цвета ткани, кромка кончается
# у вставки — крой MIN NHL 24. Генератор дал plain: под щитом цвет ткани (шнурки и вставка — того же цвета). По правилу
# пользователя (22.10: «со шнуровкой — как MIN») — шаблон MIN: швы вставки, планки и обода, вставка — цветом источника
default = true
[TOR]
source = "nhl27"
source_kits = { home = "ten", away = "eleven" }
body_color = "back"   # середина спины ровная на 100% (back — как NJD, TBL; light — только MIN)
collar = "lace"   # шнуровка у обеих форм (генератор: plain — доля «не ткани» под щитом home 0.33, away 0.00: шнурки цвета ткани)
trim_measure = "contiguous"   # ширина кромки — сплошной полосой от края по основе (edge_kit.TRIM_MEASURE)
collar_band = { home = "back", away = "back" }   # двухцветный ворот (агент tor, 22.10): у дома NHL 27 полоса у края синяя, а сзади
#   от ступеньки (~78°) до обода — белая (у выезда та же ступенька синим); кромка одним цветом красила белое синим.
#   Полоса у края (BAND_KNOTS) — цвет края, широкая часть ступеньки — цвет источника; швы у обеих форм одни (вместо
#   trim_width_from = { home = "away" }: при collar_band ширина — по своей форме)
crest_fit = { gap_min = 0.008 }   # герб крупнее: до буквы капитана 0,008 развёртки (~0,6 см), как TBL, BOS, DET
crest_size_cm = 27   # герб не меньше 27 см (√ ширина × высота), как EA-гербы NHL 13 (edge_kit.crest_to_size)
shield_offset_cm = [0.41, 0.45, 0.0]   # щит на вставке — место MIN (ворот со шнуровкой; у NHL 27 TOR щит там же, где у NHL 24 MIN)
shield_scale = 0.76   # размер MIN (пользователь, 21.10: при 0,88 «довольно большой»)
hem_h = 0.155   # м: зона низа «от края» выше полос (fb.hem.HEM_H; без поля — 0,09)
insert = ["away", "home"]   # вставка под воротом (InsertPaint, как MIN): кромка кончается у вставки, как у NHL 27
insert_color = "source"   # вставка цвета источника (у TOR — ткани: синяя / белая), не красная MIN (edge_kit.INSERT_COLOR)
letter_zones_from = {}
font_name_fit = "auto"   # фамилия: высота как у MIN, промежуток ≤ 0,23 высоты буквы (edge_kit.name_font_fit)
sock_parts = [[0.0, [0, 0, 0]]]   # не используется (sock = auto)
digit_gap = 0.086   # 24.10 (агент digits): промежуток цифр номера (видимый край к краю) к высоте цифры —
#   фото: Groulx 29 синяя, анфас (на колене) — у TOR цифры дальше всех; замер — game/work/digits-real (docs/kitport.md §12.1)

[TOR.slot.home]

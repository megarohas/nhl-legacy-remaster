#   переде плеча; у сборки 5 lace замер был по переносу — шире). Зона полос (0,13–0,255 м от манжеты) — не в замер,
#   замер — до 6 см от плеча (yoke_band_seam; без поля — 18 см: выше полос оставалась одна точка)

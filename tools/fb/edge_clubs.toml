sleeve_along = [0.0, 0.50, 0.40, 0.72]   # 26.10 (пользователь, 26.10: «если ты обнаружил, что там какие-то косяки есть относительно оригинальных форм, да, конечно, исправляй это»): у NHL 27 панель
#   рукава (дома белая, в гостях красная) с синим кантом — прямые края от манжеты к плечу, переносом шли волной;
#   края — ломаными вдоль руки (edge_kit.sleeve_along_lines), обе формы. Конец панели у плеча — по шву реглана Edge
chest_bands = [0.045, 0.24, 1.60, 1.69]   # ревью (review-d, 23.10): синий кант через грудь к V — вдвое тоньше NHL 27 (0,4 см
#   против 0,9), с изгибом у |x| 8–10 см и тёмными чёрточками над ним; края — по замеру источника (edge_kit.chest_bands_fit)

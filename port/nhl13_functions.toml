# Ручные границы функций для NHL 13 (default.xex с диска, без TU).

[functions]
# Листовые функции без .pdata: на них только хвостовые переходы `b` из
# переходников C++ (`addi r3,r3,-N; b X` — поправка this при множественном
# наследовании), поэтому сканер их не завёл (UnresolvedCall в первой генерации).
0x82E9F668 = { name = "sub_82E9F668" }
0x82CB7858 = { name = "sub_82CB7858" }  # сам переходник: одиночный b 0x82CB6C78
0x82AC44B0 = { name = "sub_82AC44B0" }
0x82B08DC0 = { name = "sub_82B08DC0" }

# switch по r4 (cmplwi r4,14 + таблица переходов): компилятор слил одинаковые
# case-блоки с соседней функцией 0x828773C0 (.pdata 0x828773C0..0x8287756C, свой
# пролог). Сканер раздвигал конец функции только до самой дальней цели таблицы + 4
# (0x82877524), блок на 0x82877520 обрывался, а beq на 0x82877544 оказывался снаружи:
# «use of undeclared label loc_82877544». Явный размер до конца общего кода.
0x82877118 = { name = "sub_82877118", size = 0x454 }

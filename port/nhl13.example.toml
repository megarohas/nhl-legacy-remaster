# Настройки запуска порта (cvar'ы ReXGlue). build.cmd копирует этот файл в папку
# сборки как nhl13.toml, если там ещё нет своего. Приоритет (include/rex/cvar.h, Source):
# правки из окна F4 и консоли > командная строка --имя=значение > REX_* > этот файл >
# умолчания. Файл читается только при старте; «Save to config» в F4 перезаписывает его
# целиком (без комментариев). Настройки графики — docs/graphics-settings.md.

# Рендер: плагин rexgpu-xenos (D3D12 на Windows).
gpu_plugin = "xenos"
# Флаги по опыту NHL 12/14/Legacy и 3 on 3 (ресерч 07.10.2026): с путём RTV матч у
# соседей рисовался чёрным; readback_resolve=full — формы игроков (и в Xenia для
# NHL 13); EA-игры читают нулевую страницу; недопустимые fetch-константы — как у Legacy.
render_target_path_d3d12 = "rov"
# "full" (синхронное чтение, точно, но с остановками) — тормоза: видеокарта ~3%, ~25 кадров (07.10.2026).
# "some" — с задержкой в кадр, только при промахе кэша: ~60 кадров.
readback_resolve = "some"
protect_zero = false
gpu_allow_invalid_fetch_constants = true

# Ввод через XInput, а не SDL: геймпад у пользователя — DualSense через DS4Windows
# (виртуальный Xbox 360). С SDL лог полон циклов «отключён/подключён», а после
# подмены DualSense → Xbox 360 процесс упал с повреждением кучи (0xC0000374) —
# похоже на гонку в InputSystem SDK при подключении устройств (известна по 3 on 3).
input_backend = "xinput"

# Файлы игры: распакованная установка с диска (tools/svod.py).
game_data_root = "S:/Claude/megarohas_nhl13/game/extracted/disc"

# Сейвы и кэш (в т. ч. раздел cache:) — локально, а не в «Документах» OneDrive.
user_data_root = "S:/Claude/megarohas_nhl13/game/userdata"

# update: (апдейт TU2) не подключаем: его patch.big рассчитан на пропатченный
# default.xex, а порт собран с диска.
# update_data_root = "S:/Claude/megarohas_nhl13/game/extracted/tu2"

# Текущий сезон — его первый год (2026 = сезон 2026/27). Игра считает «сейчас» от
# зашитого 2012: дата «Играть сейчас», год новой франшизы, номера сезонов, возраст
# проспектов; порт сдвигает все такие места (src/nhl13_year.cpp). 2012 — как в
# оригинале. Франшизу грузить с тем же season_year, с которым она создана.
season_year = 2026
